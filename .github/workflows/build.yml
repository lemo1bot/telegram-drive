name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Build debug APK (push to main)
        if: github.ref == 'refs/heads/main'
        run: ./gradlew assembleDebug

      - name: Upload debug APK artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: telegram-drive-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build debug + release APKs (version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew assembleDebug assembleRelease

      - name: Prepare Release APK files
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TelegramDrive.apk
          ls -lh TelegramDrive.apk

      - name: Create GitHub Release with APKs
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TelegramDrive.apk
          generate_release_notes: true
          body: |
            ## Download & install

            1. Download **TelegramDrive.apk** below (Assets section).
            2. Open it on your Android phone. If asked, allow **"Install unknown apps"** for your browser / Files app.
            3. Install, open the app, and follow the 3-step setup (free Telegram bot + your private group).

            ## Premium

            Telegram Drive is free with ads. **Premium** is an optional one-time purchase that removes all ads forever. Premium purchases are available in the Google Play version of the app.
