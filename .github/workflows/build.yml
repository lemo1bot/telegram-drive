name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # The gradle-wrapper.jar binary is not in the repo snapshot, so
      # regenerate the wrapper here before building.
      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      # ---- Push to main: debug APK as a downloadable build artifact ----
      - name: Build debug APK (push to main)
        if: github.ref == 'refs/heads/main'
        run: ./gradlew assembleDebug

      - name: Upload debug APK artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: telegram-drive-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # ---- Version tag (v*): build BOTH APKs and publish a GitHub Release ----
      - name: Build debug + release APKs (version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew assembleDebug assembleRelease

      - name: Prepare Release APK files
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TelegramDrive.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk TelegramDrive-release-unsigned.apk
          ls -lh TelegramDrive*.apk

      - name: Create GitHub Release with APKs
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TelegramDrive.apk
            TelegramDrive-release-unsigned.apk
          generate_release_notes: true
          body: |
            ## Download & install

            1. Download **TelegramDrive.apk** below (Assets section).
            2. Open it on your Android phone. If asked, allow **"Install unknown apps"** for your browser / Files app.
            3. Install, open the app, and follow the 3-step setup (free Telegram bot + your private group).

            `TelegramDrive.apk` is the installable build (debug-signed).
            `TelegramDrive-release-unsigned.apk` is for developers only - it is unsigned and will not install until you sign it with your own keystore.

            ## Premium - $10 forever

            The app is free with ads. A one-time **$10 lifetime Premium** purchase removes all ads forever - but purchases work **only in the Google Play version** of the app (Google Play Billing cannot run in sideloaded APKs like this one). In this GitHub build the Premium screen explains this; nothing is charged here.

            ## Ads note

            This build may still use Google's **test ad IDs** (see `AdsConfig.kt`) until the developer replaces them with their own AdMob IDs - test ads earn no revenue.
